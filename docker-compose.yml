# Entorno local con Docker (opcional: el equipo también puede usar la BD de pruebas compartida).
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://incident:incident@db:5432/incident?schema=public
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: "3000"
      TZ: America/Bogota
      DATABASE_URL: postgresql://incident:incident@db:5432/incident?schema=public
      SWAGGER_ENABLED: "true"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:fleetops_incident_events
      # Credenciales ficticias: LocalStack no las valida, pero el SDK de AWS las exige.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  # SNS/SQS locales. El script crea el topic fleetops_incident_events y la cola
  # incident_events_test_queue suscrita con raw message delivery.
  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sns,sqs
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
