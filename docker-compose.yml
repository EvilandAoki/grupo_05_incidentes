# Entorno local con Docker (opcional: el equipo también puede usar la BD de pruebas compartida).
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://incident:incident@db:5432/incident?schema=public
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: "3000"
      TZ: America/Bogota
      DATABASE_URL: postgresql://incident:incident@db:5432/incident?schema=public
      SWAGGER_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # TODO(HU_FLEETOPS_INC_04): agregar LocalStack (SNS) cuando SnsEventPublisher deje de ser un stub.

volumes:
  pgdata:
