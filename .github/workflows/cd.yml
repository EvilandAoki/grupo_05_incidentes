name: CD

# Solo despliega después de que el workflow CI (incluido el Quality Gate de SonarCloud)
# termine con éxito sobre un push a main (DAS v3.2, sección 5 y ADR-12).
# Inactivo hasta definir la variable de repositorio CD_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables) y los secretos de la guía §14.1.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build-and-push
    if: ${{ vars.CD_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    steps:
      # Se construye exactamente el commit que validó el CI.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: commit
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fleetops-incident
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.commit.outputs.short }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    if: ${{ vars.CD_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/fleetops-incident
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:3000/health > /dev/null; then echo "healthy"; exit 0; fi
              sleep 5
            done
            echo "El servicio no respondió /health" && docker compose -f docker-compose.prod.yml logs --tail=100 app && exit 1
